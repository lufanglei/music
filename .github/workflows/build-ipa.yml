name: Build IPA

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

jobs:
  build:
    name: Compile and package .ipa
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          swift --version

      - name: Build unsigned .ipa
        run: |
          bash tools/build_ipa.sh \
            --unsigned \
            --configuration "${{ github.event.inputs.configuration || 'Release' }}"

      - name: Inspect package
        run: |
          IPA=$(find dist -name '*.ipa' -type f | head -n 1)
          echo "IPA=$IPA"
          unzip -Z1 "$IPA" | head -20
          test -n "$(unzip -Z1 "$IPA" | grep '^Payload/LXMusic.app/Info.plist$')"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LXMusic-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      # 同时发布成 Release 资产：公开仓库的 Release 文件无需登录即可直接下载，
      # 固定 tag 让下载地址长期不变，后续构建用 --clobber 覆盖同名文件。
      - name: Publish .ipa to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ipa-latest"
          IPA=$(find dist -name '*.ipa' -type f | head -n 1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "LX Music iOS (unsigned .ipa)" \
              --notes "Automated unsigned build from ${GITHUB_SHA}. Resign with Sideloadly / AltStore / a Developer Team before installing on an iPhone." \
              --target "$GITHUB_SHA"
          fi
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$IPA")"
